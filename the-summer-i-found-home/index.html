<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>&nbsp;</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="https://static.vecteezy.com/system/resources/previews/054/848/394/non_2x/glossy-red-heart-shape-symbolizing-love-and-affection-free-png.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Parisienne&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#efe4cf; --paper-2:#e8dcc2; --paper-edge:#d8c8a6;
    --ink:#40352a; --ink-soft:#6c5c48;
    --rose:#d98aa9; --rose-deep:#bd6486;
    --blue:#8fb8dd; --blue-deep:#5f8fc0;
    --gold:#b8925a; --leather:#5c3a2e; --leather-2:#472b22;
    --shadow:0 30px 70px -30px rgba(40,25,15,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"EB Garamond",Georgia,serif;color:var(--ink);background:#241a12;line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
  .fell{font-family:"IM Fell English",serif}
  .script{font-family:"Parisienne",cursive}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}

  .layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hidden{display:none!important}
  .fade-out{animation:fadeOut .8s forwards}
  @keyframes fadeOut{to{opacity:0;visibility:hidden}}
  .fade-in{animation:fadeIn 1s forwards}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  /* ACT 1 */
  #gate{background:#0b1a24}
  #gate .bg{position:absolute;inset:0;background:url("https://www.iconicafrica.com/wp-content/uploads/2016/12/Iconic-Africa-Swim-With-Dolphins-Mozambique.jpg") center/cover no-repeat;filter:saturate(.92)}
  #gate .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,24,.5),rgba(6,16,24,.66) 60%,rgba(6,16,24,.8))}
  .gate-inner{position:relative;z-index:2;text-align:center;padding:24px;max-width:620px}
  .gate-line{font-style:italic;color:#fdf6ec;font-size:clamp(1.4rem,4.6vw,2.1rem);line-height:1.5;text-shadow:0 2px 24px rgba(0,0,0,.6);opacity:0;animation:rise 1.4s .3s forwards}
  .keyhole{margin:38px auto 0;width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;color:rgba(255,255,255,.85);background:rgba(255,255,255,.06);backdrop-filter:blur(3px);opacity:0;animation:rise 1.4s .8s forwards,pulse 3s 2s infinite}
  .keyhole svg{width:26px;height:26px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
  .key-wrap{margin:34px auto 0;max-width:300px;opacity:0;height:0;overflow:hidden;transition:opacity .5s}
  .key-wrap.show{opacity:1;height:auto}
  .key-wrap input{width:100%;text-align:center;letter-spacing:2px;padding:14px;font-size:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);border-radius:12px;color:#fff}
  .key-wrap input::placeholder{color:rgba(255,255,255,.5)}
  .key-wrap input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.16)}
  .key-msg{min-height:1.2em;margin-top:12px;color:#f3cdd9;font-style:italic;font-size:.95rem;opacity:0;transition:opacity .3s}
  .key-msg.show{opacity:1}

  /* ACT 2 */
  #reunion{background:radial-gradient(1200px 800px at 50% 40%,#f6dfe9 0%,#ead7e6 40%,#d8c9e2 100%)}
  .reunion-stage{position:relative;width:100%;max-width:640px;height:60vh;max-height:520px}
  .portrait{position:absolute;bottom:8%;width:44%;max-width:230px;filter:drop-shadow(0 20px 30px rgba(80,40,60,.35))}
  .portrait.him{left:-50%;animation:slideR 2.4s 1s cubic-bezier(.5,0,.2,1) forwards}
  .portrait.her{right:-50%;animation:slideL 2.4s 1s cubic-bezier(.5,0,.2,1) forwards}
  @keyframes slideR{to{left:8%}}
  @keyframes slideL{to{right:8%}}
  .glow{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,225,236,.95),rgba(216,138,169,.5) 45%,transparent 70%);animation:bloom 2s 3s forwards}
  @keyframes bloom{50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.9}}
  .heart-r{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);width:44px;height:44px;animation:heartPop 1.2s 3.4s forwards}
  @keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
  .reunion-text{position:absolute;left:0;right:0;bottom:2%;text-align:center;padding:0 20px}
  .reunion-text p{font-family:"Parisienne",cursive;color:#7a4a5e;font-size:clamp(1.4rem,5vw,2rem);opacity:0}
  .reunion-text .l1{animation:rise 1.4s 4.2s forwards}
  .reunion-text .l2{margin-top:2px;animation:rise 1.6s 5.8s forwards}
  .reunion-tap{position:absolute;bottom:-40px;left:0;right:0;text-align:center;color:#8a6a78;font-style:italic;font-size:.9rem;opacity:0;animation:fadeIn 1s 7.8s forwards}

  /* ACT 3 */
  #diary{background:radial-gradient(1000px 700px at 50% 30%,#3a2a1e,#1c130d)}
  .book3d{position:relative;width:min(78vw,340px);aspect-ratio:.72;perspective:1600px}
  .cover{position:absolute;inset:0;border-radius:8px 14px 14px 8px;transform-origin:left center;background:linear-gradient(135deg,var(--leather) 0%,var(--leather-2) 100%);box-shadow:var(--shadow),inset 0 0 60px rgba(0,0,0,.4);display:grid;place-items:center;z-index:3;backface-visibility:hidden;border:1px solid #2c1a13}
  .cover::before{content:"";position:absolute;inset:12px;border:1.5px solid rgba(184,146,90,.55);border-radius:5px}
  .cover .heart-emb{width:74px;height:74px;opacity:.9;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .cover .ctitle{position:absolute;bottom:18%;width:100%;text-align:center;color:#e8c489;font-family:"Parisienne",cursive;font-size:1.7rem;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .cover .clasp{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:20px;height:54px;border-radius:4px;background:linear-gradient(#d9b877,#a17c3f);box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .pages-stack{position:absolute;inset:0;border-radius:8px 12px 12px 8px;background:var(--paper);box-shadow:inset -8px 0 18px rgba(120,90,50,.25);z-index:1}
  .pages-stack::after{content:"";position:absolute;right:0;top:2%;bottom:2%;width:8px;background:repeating-linear-gradient(var(--paper-edge) 0 2px,var(--paper) 2px 4px)}
  #diary.open .cover{animation:openCover 1.8s .4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes openCover{to{transform:rotateY(-165deg)}}
  .diary-hint{position:absolute;bottom:8%;color:#c9a96b;font-style:italic;font-size:.9rem;text-align:center;width:100%;animation:fadeIn 1s .5s both}

  /* THE BOOK */
  #book{background:radial-gradient(1200px 800px at 50% 0%,#2c2016,#160f0a);flex-direction:column}
  .book-frame{position:relative;width:min(96vw,560px);height:min(88svh,860px);perspective:1800px}
  .page{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:radial-gradient(120% 100% at 0% 0%, rgba(255,250,236,.5), transparent 40%),linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:var(--shadow)}
  .page::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(140% 120% at 50% 50%, transparent 60%, rgba(90,60,25,.16)),linear-gradient(90deg, rgba(90,60,25,.18), transparent 8%, transparent 92%, rgba(90,60,25,.14));mix-blend-mode:multiply}
  .page::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='matrix' values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.15 0 0 0 0.05 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  .page-inner{position:absolute;inset:0;padding:clamp(30px,7vw,54px) clamp(26px,7vw,50px);display:flex;flex-direction:column;overflow:hidden;z-index:2}

  .p-chapter-num{font-family:"IM Fell English",serif;font-style:italic;color:var(--rose-deep);font-size:.9rem;letter-spacing:.32em;text-transform:uppercase;text-align:center;margin-bottom:8px}
  .p-chapter-title{font-family:"IM Fell English",serif;color:var(--ink);text-align:center;font-size:clamp(1.5rem,5.2vw,2rem);line-height:1.2;margin-bottom:6px}
  .p-chapter-rule{width:46px;height:2px;background:var(--gold);opacity:.6;margin:12px auto 22px;border-radius:2px}
  .p-text{font-size:clamp(1.02rem,3.5vw,1.14rem);color:var(--ink);text-align:justify;margin-bottom:14px;hyphens:auto}
  .p-text.first::first-letter{font-family:"IM Fell English",serif;float:left;font-size:3.4em;line-height:.8;padding:6px 8px 0 0;color:var(--rose-deep)}
  .p-quote{margin:auto;text-align:center;max-width:22ch}
  .p-quote .q{font-family:"Parisienne",cursive;font-size:clamp(1.6rem,6vw,2.3rem);color:var(--rose-deep);line-height:1.35}
  .p-quote .orn{margin-top:18px;color:var(--blue-deep);letter-spacing:.4em;opacity:.7}
  .p-title-main{margin:auto;text-align:center}
  .p-title-main .tt{font-family:"IM Fell English",serif;font-size:clamp(2rem,8vw,3rem);line-height:1.1;color:var(--ink)}
  .p-title-main .ded{font-family:"Parisienne",cursive;font-size:1.5rem;color:var(--rose-deep);margin-top:20px}
  .p-title-main .epi{font-style:italic;color:var(--ink-soft);margin-top:26px;max-width:26ch;margin-inline:auto}
  .photo{margin:auto;width:100%}
  .photo .frame{background:#fff;padding:10px 10px 34px;border-radius:3px;transform:rotate(-1.6deg);box-shadow:0 14px 30px -14px rgba(40,25,15,.6);border:1px solid #eee}
  .photo .frame img{width:100%;border-radius:2px;background:#e7d9c4}
  .photo .cap{text-align:center;font-family:"Parisienne",cursive;color:var(--ink-soft);font-size:1.3rem;margin-top:-22px;position:relative}
  .page-num{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-style:italic;color:var(--ink-soft);font-size:.82rem;z-index:3}

  .leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;z-index:20;transition:transform .78s cubic-bezier(.4,.1,.2,1);border-radius:6px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .leaf .lshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,40,20,.35),transparent 40%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
  .leaf.flip-next{transform:rotateY(-172deg)}
  .leaf.flip-next .lshade{opacity:1}
  .leaf.pre-prev{transform:rotateY(-172deg)}
  .leaf.flip-prev{transform:rotateY(0deg)}

  .tapz{position:absolute;top:0;bottom:0;width:34%;z-index:15}
  .tapz.left{left:0}.tapz.right{right:0}
  .book-chrome{margin-top:12px;display:flex;align-items:center;gap:14px;justify-content:center}
  .prog{width:min(70vw,320px);height:3px;background:rgba(216,192,144,.2);border-radius:3px;overflow:hidden}
  .prog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--blue));transition:width .4s}
  .navhint{position:absolute;bottom:64px;right:16px;color:var(--ink-soft);font-style:italic;font-size:.8rem;opacity:.7;z-index:3;animation:fadeIn 1s both}

  .idx-btn,.music-btn{position:fixed;z-index:40;width:44px;height:44px;border-radius:50%;background:rgba(30,20,12,.6);border:1px solid rgba(216,192,144,.4);color:#e8c489;display:grid;place-items:center}
  .idx-btn{top:14px;left:14px}.music-btn{top:14px;right:14px}
  .idx-btn svg,.music-btn svg{width:20px;height:20px}

  .contents{position:fixed;inset:0;z-index:60;background:rgba(20,13,8,.9);backdrop-filter:blur(6px);display:none;flex-direction:column;padding:64px 24px;overflow-y:auto}
  .contents.show{display:flex}
  .contents h3{font-family:"Parisienne",cursive;color:#e8c489;font-size:2rem;text-align:center;margin-bottom:20px}
  .contents a{display:block;text-align:center;color:#efe4cf;font-family:"IM Fell English",serif;font-size:1.15rem;padding:12px;border-bottom:1px solid rgba(216,192,144,.14)}
  .contents a:hover{color:var(--rose)}
  .contents .close-x{position:fixed;top:16px;right:16px;color:#e8c489;font-size:1.6rem}

  .interlude{margin:auto;text-align:center;width:100%}
  .interlude .cap{font-family:"Parisienne",cursive;color:var(--ink-soft);font-size:1.4rem;margin-top:16px}
  .ballerina{width:150px;height:210px;margin:0 auto;transform-origin:50% 88%;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .ballerina .spin{transform-origin:50% 60%;animation:pirou 6s ease-in-out infinite}
  @keyframes pirou{0%,20%{transform:rotateY(0)}50%{transform:rotateY(180deg)}80%,100%{transform:rotateY(360deg)}}
  .planescene{position:relative;width:100%;height:200px;margin:0 auto;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#cfe6f7,#eaf3fb 70%,#f3ead9)}
  .planescene .cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85}
  .planescene .plane{position:absolute;top:26%;left:-20%;width:54px;color:#5f8fc0;animation:fly 9s linear infinite}
  @keyframes fly{to{left:120%}}
  .planescene .couple{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;color:#3f342a}
  .planescene .heart-air{position:absolute;top:16%;left:64%;width:16px;height:16px;color:var(--rose-deep);animation:floatUp 4s ease-in-out infinite}
  @keyframes floatUp{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-8px);opacity:1}}

  #measure{position:fixed;left:-9999px;top:0;z-index:-1;visibility:hidden}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:opacity .2s!important}
    .portrait.him{left:8%}.portrait.her{right:8%}.glow,.heart-r{transform:translate(-50%,-50%) scale(1);opacity:.9}
    .reunion-text p{opacity:1}
  }
</style>
</head>
<body>

  <div class="layer" id="gate">
    <div class="bg"></div><div class="veil"></div>
    <div class="gate-inner">
      <p class="gate-line">Some stories deserve a special place to live. This one is ours.</p>
      <button class="keyhole" id="keyhole" aria-label="Enter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="3.4"/><path d="M12 12.4L10.5 20h3z"/></svg>
      </button>
      <form class="key-wrap" id="keyWrap">
        <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…" aria-label="Our word" />
        <div class="key-msg" id="keyMsg"></div>
      </form>
    </div>
  </div>

  <div class="layer hidden" id="reunion">
    <div class="reunion-stage">
      <img class="portrait him" src="https://i.ibb.co/cW535ch/1000074342-removebg-preview.png" alt="" />
      <img class="portrait her" src="https://i.ibb.co/SwT2dXrF/1000079586-removebg-preview.png" alt="" />
      <div class="glow"></div>
      <svg class="heart-r" viewBox="0 0 24 24" fill="#bd6486"><path d="M12 21s-8-4.6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.4-8 10-8 10z"/></svg>
      <div class="reunion-text">
        <p class="l1">For you, and only you.</p>
        <p class="l2">You are a thousand miles away, but the closest to my heart.</p>
        <div class="reunion-tap" id="reunionTap">tap to open our story</div>
      </div>
    </div>
  </div>

  <div class="layer hidden" id="diary">
    <div class="book3d">
      <div class="pages-stack"></div>
      <div class="cover">
        <svg class="heart-emb" viewBox="0 0 24 24" fill="#c9a96b"><path d="M12 21s-8-4.6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.4-8 10-8 10z"/></svg>
        <div class="ctitle">Our Story</div>
        <div class="clasp"></div>
      </div>
    </div>
    <div class="diary-hint" id="diaryHint">tap to open</div>
  </div>

  <div class="layer hidden" id="book">
    <button class="idx-btn" id="idxBtn" aria-label="Contents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="music-btn" id="musicBtn" aria-label="Music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
    <div class="book-frame" id="bookFrame">
      <div class="page" id="staticPage"><div class="page-inner" id="staticInner"></div><div class="page-num" id="staticNum"></div></div>
      <div class="tapz left" id="tapPrev"></div>
      <div class="tapz right" id="tapNext"></div>
    </div>
    <div class="book-chrome"><div class="prog"><i id="progFill"></i></div></div>
  </div>

  <div class="contents" id="contents">
    <button class="close-x" id="contentsClose" aria-label="Close">&times;</button>
    <h3>Contents</h3>
    <div id="contentsList"></div>
  </div>

  <div id="measure"><div class="page"><div class="page-inner" id="measureInner"></div></div></div>
  <div id="yt" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const PREVIEW_MODE = false;
  const SUPABASE_URL  = "https://lanrakgrrbyfhtzcxnof.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnJha2dycmJ5Zmh0emN4bm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQwMTQsImV4cCI6MjEwMTI1MDAxNH0.gHaVFXo5vRjcOTlwHRaNNOP1WXqL_4h3ieWg6xnz3hY";
  const HOME_PATH = "/";
  const YT_VIDEO_ID = "CqMWEjXGJg0";

  const sb = (!PREVIEW_MODE && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
  const $ = (s,r=document)=>r.querySelector(s);

  (async function guard(){
    if(PREVIEW_MODE) return;
    try{ const {data:{session}}=await sb.auth.getSession(); if(!session) window.location.replace(HOME_PATH); }
    catch(e){ window.location.replace(HOME_PATH); }
  })();

  const P = (text)=>({t:'p',text});
  const BOOK = [
    {t:'title', title:'THE SUMMER I FOUND HOME', ded:'For you, and only you.',
     epi:'It is the greatest gift to miss you, for it reminds me how lucky I was to love you. Maybe, in another life.'},

    {t:'note', title:'A note before the first page', blocks:[
      P("I did not sit down to write a book. I sat down because I was afraid."),
      P("Not afraid of anything dramatic. I was afraid of the quiet way that time takes things from us. The way a feeling that once filled an entire room slowly becomes a sentence, and then a word, and then only the shape of a word you can no longer quite remember. I have watched it happen to other memories. The colour drains first. Then the sound. Then, one ordinary afternoon, you reach for something that used to be vivid and you find only the outline of it, like a photograph left too long in the sun."),
      P("I did not want that to happen to you."),
      P("So I began to write. Not to trap the summer, and not to change it, but to build it somewhere safe, a place made of pages instead of days, where none of it is allowed to fade. If you are reading this, then it worked. You have found the place I built for us. Walk slowly through it. There is no hurry here."),
      P("This is our story. The imperfect one. The complicated one. The only one I would ever want."),
    ]},

    {t:'ballet', cap:'for the girl who speaks in ballet'},

    {t:'chapter', num:'I', title:'July 7th, 2026. SSR International Airport, Mauritius.', blocks:[
      P("There are certain days that arrive disguised as nothing at all."),
      P("July the seventh, in the year twenty twenty six, was one of them. When it began, it was only a square on a calendar. A day of alarms set too early, of bags weighed and weighed again, of passports checked and pockets patted down out of nerves rather than need. I was standing in SSR International Airport in Mauritius, farther along a journey that was carrying me farther from Seychelles than I had ever travelled for something like this, and I was thinking about everything except you, because I did not yet know there was a you to think about."),
      P("I knew the outline of what was coming. I knew I was going to the United States. I knew I would be part of the Youth Ambassadors program, that I would represent my country, that I would meet people from places I had only seen on maps. I had prepared for the version of the trip I could imagine. What I had not prepared for, what no one can ever prepare for, was the part of the trip I could not imagine."),
      P("I did not know that somewhere in that same airport was the person who would quietly rearrange the meaning of the entire season. I did not know that your name would end up written more times than any other in whatever record I kept of that summer. I certainly did not know that I would one day sit down like this and try to press all of it into sentences, terrified that if I did not, time might slowly take it from me."),
      P("But that is exactly what happened. We met there. Mauritius. The seventh of July."),
      P("And of everything that was still ahead of us, of all the flights and cities and enormous moments to come, the first thing my memory chose to keep was the awkward little box you gave me."),
    ]},

    {t:'photo', url:'https://i.ibb.co/95hYSnb/20260715-063526-5d82.jpg', cap:'where it began'},

    {t:'chapter', num:'II', title:'The awkward box', blocks:[
      P("It is almost absurd, when I think about it, that a box is where this begins."),
      P("Out of an entire summer, out of oceans crossed and cities walked and a hundred larger things, memory reached past all of it and closed its hand around something small. A box. An awkward, ordinary little box, handed over in an airport by someone I had only just met. But memory has never asked my permission about what it keeps. It ignores the grand things and hoards the tiny ones."),
      P("Because that is what I remember most. Not the box itself, but the feeling that came with it. Something moved in me. Quietly. Unmistakably. And I did not understand it at all."),
      P("I want you to know that this is not how I usually am. I am not someone who assigns enormous meaning to small gestures. If a person gives me something, I am grateful, I thank them, and the moment passes cleanly through me and is gone. And yet when you handed me that box, something refused to pass cleanly through. It caught. It stayed. It was only unfamiliar, a small disturbance in the ordinary machinery of how I understood the world, a note played slightly out of tune with everything around it."),
      P("Why did I feel that? Why did I notice it? Why, out of everyone, did I notice you? I did not know. So I did the thing people do when a feeling makes no sense. I decided it was nothing. You were just a girl I had met. There would be many people, a summer of laughter, and then everyone would go home. That was the whole story. That was all it could be."),
      P("I have never in my life been so wrong about something so quietly."),
      P("Sometimes I wish I could return to that airport, not to change a single thing, but only to stand beside the version of myself who was waiting there, so completely unaware. I would tell him to pay attention. I would tell him that the awkward box in his hands was the first page of something he would spend months trying to understand. He would laugh at me, of course. So I would let him go, and I would let it begin exactly as it did."),
    ]},

    {t:'quote', text:'You were never just someone I met. You became someone I will always remember having met.'},

    {t:'chapter', num:'III', title:'Paris', blocks:[
      P("By the time we reached Paris, the world had that bright, unfinished feeling that only the start of a journey has."),
      P("Everything was new. Everyone was new. We were a small crowd of near strangers who had suddenly become one another's entire world, and we spent those first hours quietly measuring each other. Who was loud and who was quiet. Who was funny. Who would become a friend, and who would remain, gently, just a person you happened to share a program with."),
      P("And somewhere in that shuffle, you told us something that stayed with me. You said that some of the other girls did not really talk to you. I remember the way it landed in me. Not lightly. I felt bad, and more than bad, I felt something closer to anger. I did not like the idea of you standing at the edge of a group, feeling like you did not quite belong."),
      P("Whatever the reason, I wanted you to feel included. So I asked Mariah to go and talk to you, to fold you into the group, to make you feel like part of the team."),
      P("It seems like nothing when I write it down. A quiet word to a friend. And yet I think that might have been where it truly began. Not with a confession, not with some cinematic moment under a perfect sky, but with something far plainer. It began with me simply caring whether or not you felt like you belonged."),
      P("I was not thinking about love. I was nowhere near thinking about love. I only knew that I wanted you to be okay, and that wanting it mattered to me more than it had any right to. Paris was one of those quiet beginnings."),
    ]},

    {t:'chapter', num:'IV', title:'The flight to Washington, D.C.', blocks:[
      P("Then came the flight to Washington, D.C., and with it a small, private truth I could no longer completely hide from myself."),
      P("I was sitting beside Mariah. But I kept leaning over. Again and again, without quite deciding to, I would lean into the aisle or across the row just to see whether you were okay. It became almost involuntary, a small orbit my attention kept falling into. Mariah, watching me lean, decided I was looking at Dhyana. She was wrong. I could not have cared less who she thought I was looking at, because I knew, with complete and slightly frightening clarity, exactly who I was looking at. You."),
      P("There was something about you that kept quietly reclaiming my attention. I would try to settle into whatever was happening around me, and then, without permission, my eyes would find you again. Were you okay? Were you comfortable? I do not think I even wanted answers. I just wanted to see you. That was the whole of it."),
      P("Looking back, that flight was one of the first moments I could have been honest with myself. But I did not. I was still deep in the comfortable business of denial, and I was becoming remarkably good at it. So I ignored it. Again. I ignored it the way you ignore a sound in another room, telling yourself it is nothing, until it becomes impossible to pretend you cannot hear it."),
    ]},

    {t:'quote', text:'Somewhere between meeting you and losing you, you became a part of me.'},

    {t:'chapter', num:'V', title:'Washington, D.C.', blocks:[
      P("We landed in Washington, D.C., and for the first couple of days, the two of us were not really the two of us yet."),
      P("There was too much happening. There were places to be and people to meet and a whole program unfolding around us, and in all of that motion, you and I were still just two points in a larger constellation. And yet, even then, of course even then, I noticed you."),
      P("I remember the Botanical Garden most of all. I remember seeing you there, among all that green and glass and gentle light, and I remember the simple, stubborn fact of it. I could not take my eyes off you. You looked extraordinarily beautiful. Just a quiet, private astonishment that kept pulling my gaze back to you the way the tide keeps returning to the same stretch of shore."),
      P("It was the first time I began to see you as something other than another person in the program. Not just a girl I had met. Not just a friend forming. You were quietly becoming Olivia. My Olivia. Even though I had no right to the word, even though I did not know what we were. The feeling had already arrived. I was only beginning to learn its name."),
    ]},

    {t:'photo', url:'https://i.ibb.co/8gQFMRvS/20260715-063526-e148.jpg', cap:'my Olivia'},

    {t:'quote', text:'I found you thousands of miles from home, only to discover that home could be a person.'},

    {t:'chapter', num:'VI', title:'The flight to Alabama', blocks:[
      P("Then came the flight to Alabama, and one of the smallest, most ordinary moments I own."),
      P("You were sleeping. I was watching you. There is something strange and tender about watching someone sleep when you have started to care for them, because sleep strips everything away. There is no performance in it, no conversation, no careful arranging of yourself for the world. There is only the person, entirely unguarded. You were like that beside me, peaceful and unaware, and I remember thinking, very simply, that you looked cute."),
      P("And then I noticed the biscuit. They had handed them out, and somehow you had not gotten yours, and mine was, I will be honest, really good. I wanted the other one too. I actually did. There was a small, ridiculous, entirely human moment where part of me wanted to keep it. But I gave you mine instead. It was more that the wanting to give was louder than the wanting to keep, and so my hand simply followed the louder feeling."),
      P("I do not fully know why such a tiny thing has stayed with me so stubbornly. Perhaps because it was the moment I began to understand what caring for someone actually looks like, that it is almost never the grand gesture. Sometimes it looks like a biscuit you wanted, handed over without ceremony. Sometimes it is so small that it would be invisible to anyone standing outside of it. But you were not standing outside of it. And neither was I. So we both noticed."),
    ]},

    {t:'quote', text:'If I could keep one thing from that summer, it would not be a photograph. It would be one more ordinary moment beside you.'},

    {t:'chapter', num:'VII', title:'Alabama', blocks:[
      P("And then there was Alabama, and that campus, which I do not think I will ever be able to remember without something tightening gently in my chest."),
      P("Because Alabama is where we finally became more than two people who happened to be travelling in the same direction. It is where whatever had been forming between us finally had room and time to take a real shape. We talked. We laughed, and how we laughed. We began, without ever quite announcing it, to orbit each other, to end up near one another in rooms, to save each other glances across crowds. A friendship, we called it, at least out loud. A friendship we were both still very carefully, very unconvincingly, in denial about."),
      P("Because I think we both already knew. There was something there, obvious and warm and impossible, and neither of us wanted to say it too loudly, because saying a thing out loud makes it real. But feelings are stubborn creatures. They do not shrink because you refuse to look at them. They grow. They wait. They leak out through the smallest cracks. A look held a half second too long. A laugh that lands a little too easily. A hand that comes close to another hand and then, shyly, does not."),
      P("And the eye contact. I have to tell you about the eye contact. God, the eye contact. There were moments in Alabama when we would simply look at each other and I would feel as though we were having an entire conversation without a single word, whole sentences passing silently between us, understood perfectly, spoken by no one."),
      P("There was so much laughter. So much joy. A kind of happiness I had genuinely not expected to find so far from Seychelles. I had come to America believing I would learn about leadership and culture. I did not know I would also learn about myself, or what it feels like to care about another person so completely that it rearranges you from the inside."),
      P("But somewhere on that campus, the pretending finally collapsed. The feelings became too large to keep folding away, and so we did the terrifying, necessary thing. We let them out into the open. And the moment we did, everything changed. I did not have a single answer to any of the questions it raised. I only knew two things, and I knew them completely. I loved being near you. And I loved you."),
    ]},

    {t:'photo', url:'https://i.ibb.co/39K8JM8B/20260720-000357-f6d5.jpg', cap:'so much laughter'},

    {t:'plane', cap:'thirty thousand feet, and your hand in mine'},

    {t:'chapter', num:'VIII', title:'The flight to New York', blocks:[
      P("Then came the flight to New York, and one of the happiest small moments of my whole life."),
      P("You changed seats. You came, simply and deliberately, and sat beside me. I do not think you will ever fully understand what that did to me. There are moments when something almost nothing, a choice so small the rest of the world would never even register it, creates a feeling so enormous you can barely hold it. Out of all the seats and all the people, you chose to sit beside me, and the happiness that moved through me in that instant asked for nothing else."),
      P("And then, on the second flight, our hands met for the first time. It was so natural. That is the part I keep coming back to, the detail I hold onto most tightly, that it was not awkward, not forced, not carefully engineered by either of us. It simply happened, the way the most important things somehow always seem to simply happen. One moment our hands were apart and the next they were not, and it felt less like a decision than like a returning, as if they had somehow always been meant to find each other."),
      P("And when they touched, I felt something move between us. It was as though every feeling we had spent weeks trying to understand suddenly had somewhere to go, and it went, flowing quietly back and forth through the place where my hand held yours. Our hands were saying everything our mouths had been too careful to say."),
      P("And there we were. Holding hands. Together. Free, at least for the length of a flight, to simply feel what we felt without apology. I remember not wanting the flight to end. You spend so much of your life impatient to arrive. But that day I wanted the plane to stay in the sky forever. You were beside me, your hand in mine, and for once the destination did not matter at all."),
    ]},

    {t:'quote', text:'I would cross the same distance again, knowing it would lead me to you, even knowing I would have to leave you.'},

    {t:'chapter', num:'IX', title:'New York', blocks:[
      P("We arrived in New York with our minds in a beautiful, tangled mess. Mine certainly was."),
      P("I was carrying feelings I had never carried before, and I had no map for any of them. Was this love? Or was it something the circumstances had manufactured, the intensity of travel, the distance from everything familiar? I did not know. I only knew what it felt like, and what it felt like was enormous. That night, I fell asleep with love on my mind, and you were the shape of every thought I had."),
      P("And it was around then that I gave you your letter. The first one. I have always found that there are things I can write which I could never manage to say. Speaking to someone you love is a kind of freefall. There is no backspace, no second draft. But writing is patient. It lets you stop, and think, and cross out, and begin again, until you finally find the sentence that means exactly what you feel. So I wrote. And then I did the most frightening thing I had done all summer. I handed it to you."),
      P("Suddenly something that had existed only in the private dark of my own head was outside of me, real, sitting in your hands. That was terrifying. It was also one of the most beautiful things I have ever done. Because love does not answer any of the questions you most want answered. It does not tell you what happens next. It simply exists, vast and certain and completely indifferent to whether the world will let it survive. I loved it anyway. I loved the feeling. I loved you."),
    ]},

    {t:'photo', url:'https://i.ibb.co/JFFw0B96/20260723-173525-c458.jpg', cap:'the first letter'},

    {t:'chapter', num:'X', title:'Vermont', blocks:[
      P("Then came Vermont, and the words the last day, which I heard and understood entirely wrong."),
      P("I thought those words meant an ending. I thought they meant that this was where the talking stopped, where whatever we were simply switched off. I took a phrase and I filled it with my own fear, and then I acted on the fear instead of asking what the phrase had actually meant. And in doing that, I hurt myself, but far worse, I hurt you."),
      P("We stopped talking. Two days. Then three. And those days were genuinely painful in a way I had not braced for. I do not think I understood how completely you had woven yourself into my ordinary hours until the thread was suddenly pulled and everything went quiet. First a person is simply someone you know. Then someone you look for. Then someone whose messages can turn a whole grey day bright. And then, before you have noticed any of it, someone whose absence leaves a silence so loud you cannot think over it."),
      P("And I knew, even then, that some of it was my fault. I wish I had understood what you meant instead of deciding what you meant. I wish I had asked instead of assumed. I wish I had trusted the thing that was so clearly alive between us instead of handing the interpreting of it over to fear, which always interprets everything as loss. So I did the only thing left to do. I waited. And I hoped."),
    ]},

    {t:'quote', text:'The hardest goodbye is the one you know your heart is not ready to say.'},

    {t:'chapter', num:'XI', title:'That night in Vermont', blocks:[
      P("And then there was that night, the one I will carry, intact, for the rest of my life."),
      P("I set out to find your room, and I could not. I got lost, and then lost again, and the more I tried the more hopeless it seemed to become. I remember the frustration rising in me, aimed entirely at myself. I could not find it. I kept going anyway. Down one corridor and back. Trying, and trying, and trying. And there was a moment where a small voice suggested I should simply give up, that this was foolish. I did not give up."),
      P("And let me tell you something, as plainly and as truly as I know how. It was worth it. Every wrong turn. Every minute of frustration. Every ounce of uncertainty. I do not regret a second of it, not then and not now, because that night became one of the memories I know, with total certainty, that I will keep until I have no memories left to keep."),
      P("You were my first kiss. And I am grateful, grateful in a way I am not sure I will ever fully be able to explain to you. Because a first kiss is a thing you only get to give away once, and I will never have to wonder whether I wasted mine, or wish it had been someone else. It was you. It will always have been you."),
      P("I remember thinking, that night, that I wished you could be my first real relationship too. I wanted so badly for you to take me seriously, to understand that none of this was a game to me, not something I would fold up and forget the moment the program ended. I loved you. And I could not imagine what I would do without being able to talk to you. That thought terrified me, because I could feel the ending coming, and somewhere quietly inside me, even on that beautiful night, I had already begun to grieve something that had not yet ended."),
    ]},

    {t:'photo', url:'https://i.ibb.co/Cp2ssynv/20260729-175744-0d64.jpg', cap:'worth every wrong turn'},

    {t:'quote', text:'Some memories hurt not because they were bad, but because they were too beautiful to repeat.'},

    {t:'chapter', num:'XII', title:'The return to Washington', blocks:[
      P("Then we flew back to Washington, and I began, slowly, to feel dead inside."),
      P("Because now I knew exactly what was coming, and knowing is its own particular kind of ache. You were going home. Back to your life. Back to your boyfriend. And I was going home too, back across an entire ocean, back to Seychelles, back, supposedly, to the person I had been before any of this began. Except I already knew I was not that person anymore, and I never would be again. You had changed me."),
      P("I felt too many things at once to separate any of them cleanly. I was happy, because of everything we had been given. I was grateful. I was heartbroken. I was frightened. And underneath it all, I was quietly furious at time itself, for being so unforgivably cruel, for letting something feel this important while giving it so little room to exist."),
      P("I started counting the moments we had left. And I hated myself for it, because the moment you begin counting, everything turns into a goodbye. Every conversation becomes a possible last conversation. Every look becomes something you find yourself trying to memorise. But I could not stop. The number kept shrinking, and I kept watching it shrink."),
    ]},

    {t:'quote', text:'I will miss the person I was when I was beside you, because you brought out a version of me I had never known.'},

    {t:'chapter', num:'XIII', title:'The last flight', blocks:[
      P("And then came the final flight, and somehow, some small, undeserved mercy, I was lucky enough to sit beside you one last time."),
      P("I loved it. I want to say that clearly, because it is true. I loved being beside you. I loved knowing that for a few more hours there was no distance in the world between us. But it was different this time, and I could not pretend otherwise, because this time I knew. There was no comforting uncertainty left to hide inside. This was the last flight. There would not be another where I could glance to the side and simply find you sitting there."),
      P("So I tried to memorise all of it. The feeling of sitting beside you. The simple, enormous fact of your presence. I loved it, and I loved you, and I tried to hold every second of it tightly enough that it might survive the landing."),
      P("And then we landed, and the end arrived the way endings so often do, clumsily, too fast, before I was ready. I am sorry I did not give you a proper goodbye in duty free. I have replayed it more times than I would like to admit. I am sorry for the things I did wrong, and there were things I did wrong. I am sorry for the times I was not honest. I am sorry for the moments I did not believe you when I should have. I am sorry for every time fear made me behave like someone smaller than the person I actually wanted to be for you."),
      P("But I cannot rewrite the summer. I can only write it down. Because a photograph can show you where two people stood, but it cannot show you what was moving through them as they stood there. A photograph can show two hands held together, but it cannot show everything that travelled between them. That is why I chose words. I wanted somewhere that this version of us could go on existing exactly as I remember it. Not flawless, not without mistakes, but real."),
    ]},

    {t:'photo', url:'https://i.ibb.co/rfsYwNLD/20260729-175744-86cc.jpg', cap:'before the goodbye'},

    {t:'quote', text:'You were a chapter I never wanted to finish, in a story that time refused to let me keep.'},

    {t:'chapter', num:'XIV', title:'Home', blocks:[
      P("And then I came home. Seychelles. Home."),
      P("The place I had missed. The place I had spent weeks quietly aching to return to. And yet, when I finally arrived, coming home felt stranger than leaving ever had, because somewhere across all those airports and flights, the word itself had quietly changed its meaning on me. I had wanted home. I had missed home. But by the time I reached it, another person had become tangled up in what the word was supposed to mean. You."),
      P("That might be the strangest thing you ever did to me, and you did it without trying. You made me understand that home does not have to be a country. Sometimes home is a person. A particular laugh. A hand that fits into yours as if it had been measured for it. Sometimes home is someone thousands of miles away, on the other side of an ocean, and you carry the ache of it everywhere, because part of you is simply no longer where the rest of you is."),
      P("Geographically, I was exactly where I belonged. But some quieter part of me had stayed behind, somewhere between Alabama and New York, somewhere in Vermont, somewhere in the seat beside you. I had not only travelled to America. I had travelled through an entire range of things I had never felt before, from curiosity to friendship, from friendship to affection, from affection to love, from love to fear, from fear to regret, and finally, slowly, toward something like acceptance."),
      P("The program taught me about culture, and leadership, and responsibility. But you taught me something the program never could. You taught me about my own heart, that it was capable of caring so deeply that distance itself could become a physical ache. You taught me that love can arrive without asking permission, and that not every beautiful thing is built to last. Maybe that is exactly why it hurts. Because it was beautiful. Because it mattered. Because it truly happened."),
    ]},

    {t:'photo', url:'https://i.ibb.co/VphSdq3j/20260729-175744-ef8a.jpg', cap:'home became a person'},

    {t:'quote', text:'Maybe we were a beautiful coincidence, destined to happen but never destined to remain.'},

    {t:'chapter', num:'XV', title:'If you ever read this', blocks:[
      P("If you are reading this someday, Olivia, then there are some things I need you to know."),
      P("I do not know what our lives will look like by the time these words reach you. Life has a strange habit of moving people quietly around the board, and the girl I met in Mauritius and the person reading this one day may not even feel like the same person anymore. I will have changed too. That is allowed. That is how it is supposed to go."),
      P("But there is one thing I hope never changes. I hope that when you think back on the summer of twenty twenty six, you smile. Not because it was perfect. It was not. But because there was something genuinely, quietly extraordinary in the fact of it, that two people from different lives and different places happened to meet in the middle of a journey, and somehow, against all the odds and all the timing, became important to one another."),
      P("I hope you remember the laughter. I hope you remember the flights, and Alabama, and New York, and Vermont. I hope you remember the first time our hands met. I hope you remember the letters, and the awkward box, and the biscuit, and every small, invisible thing that no one else would ever have noticed but us. And I hope, somewhere in the middle of all of it, you remember me, because I promise you, without any effort at all, I will always remember you."),
      P("I arrived in the United States as a young Seychellois Youth Ambassador who wanted, very sincerely, to learn about the world. I left having seen more of it than I ever expected, not only the cities and the cultures, but the interior geography of my own heart, which I had never really visited before. And somewhere in the middle of all that growing, quietly and completely, I fell in love with you."),
      P("I would not erase it, not the joy, and not the pain, not the misunderstandings, not the silence, not even the goodbye. Because to remove the painful parts would be to remove the very things that made it real. I only ever wanted our story: the imperfect one, the complicated one, the one where we were young and confused and doing our best with feelings neither of us had planned for."),
    ]},

    {t:'quote', text:'I do not regret loving you. I only wish love had been enough to make us stay.'},

    {t:'chapter', num:'XVI', title:'The place I built for us', blocks:[
      P("I do not know what comes next. Maybe this is the end of one story. Maybe it is only the end of a chapter, and life is quietly holding a page I cannot see yet. I cannot promise you anything about the future. I have learned better than to try."),
      P("But I can promise you something about the past, and I mean it with everything in me. I will never pretend it did not matter. Because it did. You did. This did. That summer did. And if the day ever comes when the memories start to blur and the exact feeling of it all starts to slip away from you, then I hope you will open these pages and find it waiting, still here, still whole, still ours."),
      P("I hope you can return to Mauritius. To that airport. To the awkward box. To Paris, and the flight, and Washington, and the girl I could not stop looking at in the Botanical Garden. To the biscuit. To Alabama, and all that laughter. To New York, and the seat you chose, and the first time our hands found each other. To Vermont, and the room I refused to stop looking for, and the first kiss. To the last flight. To the goodbye I got wrong. And finally, to home."),
      P("Perhaps some journeys do not really end when the plane lands. Perhaps they go on living inside the people we become afterward. Perhaps, in that quiet way, you are still travelling with me even now, and perhaps that is enough."),
      P("And if you ever wonder what I felt through all of it, you do not have to wonder. It is here. Every word of it. Every page. It is all here, and you are here, and perhaps that is the closest thing to forever that I am able to give you. I cannot stop time. But I can write. So I did. For you. For me. For us. For the boy who met a girl at an airport in Mauritius and had absolutely no idea that she would turn out to be home."),
      P("July the seventh, twenty twenty six. Mauritius. That is where I met you. And no matter how many years go by, I think I will always remember the beginning, because some dates are only dates, until someone gives them meaning. And you gave July the seventh meaning."),
    ]},

    {t:'photo', url:'https://i.ibb.co/gZ1nhnmb/20260729-175826-dfba.jpg', cap:'always'},

    {t:'quote', text:'It is the greatest gift to miss you, for it reminds me how lucky I was to love you. Maybe, in another life.'},
  ];

  function heartSVG(color){return `<svg viewBox="0 0 24 24" fill="${color}" style="width:100%;height:100%"><path d="M12 21s-8-4.6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.4-8 10-8 10z"/></svg>`;}
  function nodeFor(block){
    const w=document.createElement('div');
    if(block.t==='title'){
      w.className='p-title-main';
      w.innerHTML=`<div class="tt fell">${block.title}</div><div class="ded">${block.ded}</div><div class="epi">${block.epi}</div>`;
    } else if(block.t==='chapter-head'){
      w.innerHTML=`<div class="p-chapter-num">Chapter ${block.num}</div><div class="p-chapter-title">${block.title}</div><div class="p-chapter-rule"></div>`;
    } else if(block.t==='note-head'){
      w.innerHTML=`<div class="p-chapter-title" style="font-style:italic;font-size:clamp(1.3rem,4.6vw,1.7rem)">${block.title}</div><div class="p-chapter-rule"></div>`;
    } else if(block.t==='p'){
      w.className='p-text'+(block.first?' first':'');
      w.textContent=block.text;
    } else if(block.t==='quote'){
      w.className='p-quote';
      w.innerHTML=`<div class="q">${block.text}</div><div class="orn">✦ ✦ ✦</div>`;
    } else if(block.t==='photo'){
      w.className='photo';
      w.innerHTML=`<div class="frame"><img src="${block.url}" alt="" loading="lazy"/></div>${block.cap?`<div class="cap">${block.cap}</div>`:''}`;
    } else if(block.t==='ballet'){
      w.className='interlude';
      w.innerHTML=`<div class="ballerina"><svg viewBox="0 0 100 150" fill="none"><g class="spin"><ellipse cx="50" cy="92" rx="30" ry="12" fill="#d98aa9" opacity=".85"/><path d="M50 92 L34 96 L50 100 L66 96 Z" fill="#c06a8b"/><circle cx="50" cy="30" r="9" fill="#40352a"/><path d="M50 39 C46 55 46 70 50 90 C54 70 54 55 50 39Z" fill="#40352a"/><path d="M50 46 C40 50 33 44 30 38" stroke="#40352a" stroke-width="3" stroke-linecap="round"/><path d="M50 46 C60 50 68 42 72 34" stroke="#40352a" stroke-width="3" stroke-linecap="round"/><path d="M50 90 C46 108 44 122 40 138" stroke="#40352a" stroke-width="3.4" stroke-linecap="round"/><path d="M50 90 C54 106 58 118 66 128" stroke="#40352a" stroke-width="3.4" stroke-linecap="round"/></g></svg></div><div class="cap">${block.cap||''}</div>`;
    } else if(block.t==='plane'){
      w.className='interlude';
      w.innerHTML=`
        <div class="planescene">
          <div class="cloud" style="width:60px;height:24px;top:18%;left:12%"></div>
          <div class="cloud" style="width:80px;height:28px;top:30%;left:60%"></div>
          <div class="cloud" style="width:46px;height:18px;top:12%;left:78%"></div>
          <svg class="plane" viewBox="0 0 64 64" fill="currentColor"><path d="M2 34l60-14-14 24-10-6-8 10-4-10z"/></svg>
          <div class="heart-air">${heartSVG('#bd6486')}</div>
          <svg class="couple" viewBox="0 0 120 70" fill="currentColor">
            <circle cx="44" cy="16" r="8"/><path d="M36 30c0-6 16-6 16 0v34H36z"/>
            <circle cx="78" cy="16" r="8"/><path d="M70 30c0-6 16-6 16 0v34H70z"/>
            <path d="M52 40c4-3 12-3 16 0" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="cap">${block.cap||''}</div>`;
    }
    return w;
  }

  const flat=[]; const toc=[];
  BOOK.forEach(sec=>{
    if(sec.t==='chapter'){
      flat.push({t:'chapter-head',num:sec.num,title:sec.title,_tocTitle:sec.title});
      sec.blocks.forEach((b,i)=>flat.push(i===0?{...b,first:true}:b));
    } else if(sec.t==='note'){
      flat.push({t:'note-head',title:sec.title,_tocTitle:sec.title});
      sec.blocks.forEach((b,i)=>flat.push(i===0?{...b,first:true}:b));
    } else {
      if(sec.t==='title'){ sec._tocTitle='Title page'; }
      flat.push(sec);
    }
  });

  const measureInner=$('#measureInner');
  const staticInner=$('#staticInner'), staticNum=$('#staticNum');
  let pages=[];
  function syncMeasureSize(){ const r=staticInner.getBoundingClientRect(); measureInner.style.width=r.width+'px'; measureInner.style.height=r.height+'px'; }
  function fits(blocks){ measureInner.innerHTML=''; blocks.forEach(b=>measureInner.appendChild(nodeFor(b))); return measureInner.scrollHeight <= measureInner.clientHeight+1; }
  const soloTypes=new Set(['title','quote','photo','ballet','plane']);
  function paginate(){
    syncMeasureSize(); pages=[]; let cur=[];
    for(const b of flat){
      if(soloTypes.has(b.t)){ if(cur.length){pages.push(cur);cur=[];} pages.push([b]); continue; }
      if(b.t==='chapter-head'||b.t==='note-head'){ if(cur.length){pages.push(cur);cur=[];} cur=[b]; continue; }
      const test=cur.concat([b]);
      if(fits(test)){ cur=test; } else { if(cur.length) pages.push(cur); cur=[b]; }
    }
    if(cur.length) pages.push(cur);
    toc.length=0; pages.forEach((pg,i)=>{ const head=pg.find(x=>x._tocTitle); if(head) toc.push({title:head._tocTitle,page:i}); });
    buildContents();
  }
  function renderPageInto(innerEl,numEl,idx){ innerEl.innerHTML=''; (pages[idx]||[]).forEach(b=>innerEl.appendChild(nodeFor(b))); if(numEl) numEl.textContent = idx>0 ? String(idx) : ''; }

  let current=0, turning=false;
  const frame=$('#bookFrame');
  function updateChrome(){ $('#progFill').style.width=((current/Math.max(1,pages.length-1))*100)+'%'; }
  function turn(idx,dir){
    if(turning||idx<0||idx>=pages.length||idx===current) return;
    turning=true;
    const leaf=document.createElement('div'); leaf.className='page leaf';
    const li=document.createElement('div'); li.className='page-inner';
    const ln=document.createElement('div'); ln.className='page-num';
    const sh=document.createElement('div'); sh.className='lshade';
    leaf.appendChild(li); leaf.appendChild(ln); leaf.appendChild(sh);
    if(dir==='next'){
      renderPageInto(li,ln,current); renderPageInto(staticInner,staticNum,idx);
      frame.insertBefore(leaf,$('#tapPrev'));
      requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('flip-next')));
    } else {
      renderPageInto(li,ln,idx); leaf.classList.add('pre-prev');
      frame.insertBefore(leaf,$('#tapPrev'));
      requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.remove('pre-prev');leaf.classList.add('flip-prev');}));
    }
    leaf.addEventListener('transitionend',()=>{ renderPageInto(staticInner,staticNum,idx); leaf.remove(); turning=false; },{once:true});
    current=idx; updateChrome();
  }
  const next=()=>turn(current+1,'next');
  const prev=()=>turn(current-1,'prev');
  $('#tapNext').addEventListener('click',next);
  $('#tapPrev').addEventListener('click',prev);
  document.addEventListener('keydown',e=>{if($('#book').classList.contains('hidden'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
  let sx=0;
  frame.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  frame.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){dx<0?next():prev();}},{passive:true});
  function jumpTo(idx){ if(idx===current)return; current=Math.max(0,Math.min(idx,pages.length-1)); renderPageInto(staticInner,staticNum,current); updateChrome(); }

  function buildContents(){
    const list=$('#contentsList'); list.innerHTML='';
    toc.forEach(t=>{ const a=document.createElement('a'); a.textContent=t.title; a.href='#'; a.addEventListener('click',e=>{e.preventDefault();$('#contents').classList.remove('show');jumpTo(t.page);}); list.appendChild(a); });
  }
  $('#idxBtn').addEventListener('click',()=>$('#contents').classList.add('show'));
  $('#contentsClose').addEventListener('click',()=>$('#contents').classList.remove('show'));
  let rT; window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const keep=current;paginate();current=Math.min(keep,pages.length-1);renderPageInto(staticInner,staticNum,current);updateChrome();},250);});

  $('#keyhole').addEventListener('click',()=>{ $('#keyWrap').classList.add('show'); setTimeout(()=>$('#keyInput').focus(),120); });
  $('#keyWrap').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const attempt=$('#keyInput').value.trim(); const msg=$('#keyMsg');
    if(!attempt){msg.textContent='…';msg.classList.add('show');return;}
    if(PREVIEW_MODE){ openReunion(); return; }
    msg.textContent=''; msg.classList.remove('show');
    const {data,error}=await sb.rpc('love_unlock',{attempt});
    if(error||!data){ msg.textContent='not our word'; msg.classList.add('show'); return; }
    openReunion();
  });
  function openReunion(){
    startMusic();
    $('#gate').classList.add('fade-out');
    setTimeout(()=>{ $('#gate').classList.add('hidden'); $('#reunion').classList.remove('hidden'); $('#reunion').classList.add('fade-in'); },700);
  }
  function goDiary(){
    $('#reunion').classList.add('fade-out');
    setTimeout(()=>{ $('#reunion').classList.add('hidden'); $('#diary').classList.remove('hidden'); $('#diary').classList.add('fade-in'); },700);
  }
  $('#reunion').addEventListener('click',()=>{ if(!$('#reunion').classList.contains('hidden')) goDiary(); });
  setTimeout(()=>{ if(!$('#reunion').classList.contains('hidden')) goDiary(); }, 12000);

  function openBook(){
    $('#diary').classList.add('open');
    setTimeout(()=>{
      $('#diary').classList.add('fade-out');
      setTimeout(()=>{
        $('#diary').classList.add('hidden');
        $('#book').classList.remove('hidden'); $('#book').classList.add('fade-in');
        (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{
          paginate(); renderPageInto(staticInner,staticNum,0); current=0; updateChrome();
          const hint=document.createElement('div'); hint.className='navhint'; hint.textContent='tap the pages to turn ›';
          frame.appendChild(hint); setTimeout(()=>hint.remove(),4200);
        });
      },700);
    },2400);
  }
  $('#diary').addEventListener('click',()=>{ if(!$('#diary').classList.contains('open')) openBook(); });

  let ytPlayer=null, ytReady=false, musicOn=true, musicWanted=false;
  const tag=document.createElement('script'); tag.src="https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){
    ytPlayer=new YT.Player('yt',{ videoId:YT_VIDEO_ID,
      playerVars:{autoplay:0,controls:0,loop:1,playlist:YT_VIDEO_ID,modestbranding:1,playsinline:1,rel:0},
      events:{onReady:()=>{ytReady=true; if(musicWanted) doPlay();}} });
  };
  function doPlay(){ try{ytPlayer.unMute();ytPlayer.setVolume(45);ytPlayer.playVideo();}catch(e){} }
  function startMusic(){ musicWanted=true; if(ytReady) doPlay(); }
  $('#musicBtn').addEventListener('click',()=>{
    musicOn=!musicOn;
    try{ if(musicOn){ytPlayer.unMute();ytPlayer.playVideo();}else{ytPlayer.pauseVideo();} }catch(e){}
    $('#musicBtn').style.opacity=musicOn?'1':'.5';
  });
  </script>
</body>
</html>
