<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book — Tyler Nicholas</title>
<meta name="description" content="A book by Tyler Nicholas." />
<link rel="icon" href="https://i.ibb.co/GQf0hjq1/Tyler-Nicholas-Books-removebg-preview.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#ffffff; --paper-2:#f4f3ef; --paper-3:#eceae4;
    --ink:#131313; --ink-2:#2c2c2c; --grey:#6d6d6a;
    --line:rgba(19,19,19,.14); --line-2:rgba(19,19,19,.30);
    --pink:#c9628a;
    --shadow-sm:0 2px 4px rgba(0,0,0,.04),0 16px 34px -20px rgba(0,0,0,.34);
    --shadow:0 34px 64px -30px rgba(0,0,0,.42);
    --maxw:1120px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:"EB Garamond",Georgia,serif;color:var(--ink);background:var(--paper);line-height:1.72;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .disp{font-family:"Fraunces",Georgia,serif}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:22px}
  .eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--grey)}

  /* loader */
  #loader{position:fixed;inset:0;z-index:2000;background:var(--paper);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
  #loader.hide{opacity:0;visibility:hidden}
  #loader .box{display:flex;flex-direction:column;align-items:center;gap:20px}
  #loader img{height:80px;width:auto;animation:ldFade 1.8s ease-in-out infinite}
  #loader .ln{width:120px;height:1px;background:var(--line);position:relative;overflow:hidden}
  #loader .ln::after{content:"";position:absolute;left:-40%;top:0;height:100%;width:40%;background:var(--ink);animation:ldSlide 1.3s ease-in-out infinite}
  @keyframes ldFade{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes ldSlide{0%{left:-40%}100%{left:120%}}

  /* nav */
  header.site{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .announce{background:var(--ink);color:#fff;text-align:center;font-size:.9rem;padding:9px 16px;display:none}
  .announce.show{display:block}
  .nav{display:flex;align-items:center;justify-content:space-between;height:74px}
  .brand img{height:42px;width:auto}
  .nav-links{display:flex;gap:30px;align-items:center}
  .nav-links a{font-size:.96rem;color:var(--ink-2);padding:6px 0;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
  .nav-links a:hover{color:var(--ink)}
  .nav-links a.active{color:var(--ink);border-color:var(--ink)}
  .hamb{display:none;width:44px;height:44px;place-items:center}
  .hamb svg{width:24px;height:24px}
  @media(max-width:760px){
    .hamb{display:grid}
    .nav-links{position:fixed;inset:74px 0 auto 0;flex-direction:column;gap:0;background:var(--paper);border-bottom:1px solid var(--line);transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;padding:8px 0 14px}
    .nav-links.open{opacity:1;transform:none;pointer-events:auto}
    .nav-links a{width:100%;text-align:center;padding:15px 0;border-bottom:1px solid var(--line)}
    .nav-links a.active{border-color:var(--line)}
  }

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:1rem;padding:13px 28px;border-radius:2px;background:var(--ink);color:#fff;border:1px solid var(--ink);transition:opacity .2s,transform .08s}
  .btn:hover{opacity:.85}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff;opacity:1}
  .btn.pink{background:var(--pink);border-color:var(--pink)}

  section{padding-block:clamp(48px,7vh,84px)}

  /* covers */
  .cover{position:relative;aspect-ratio:2/3;width:100%;border-radius:2px;overflow:hidden;background:var(--paper-3);box-shadow:var(--shadow)}
  .cover img{width:100%;height:100%;object-fit:cover}
  .cover.ph{display:grid;place-items:center;padding:20px;text-align:center;background:linear-gradient(155deg,#1c1c1c,#000);color:#f3f1ec}
  .cover.ph.priv{background:linear-gradient(155deg,#7a3255,#3f1b2e)}
  .cover.ph .ph-t{font-family:"Fraunces",serif;font-size:1.35rem;line-height:1.2}
  .cover.ph::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.16)}
  .chip{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.72);color:#fff;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:2px;display:flex;align-items:center;gap:5px}
  .chip.pink{background:var(--pink)}
  .chip svg{width:11px;height:11px}
  .badge{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line-2);padding:3px 9px;border-radius:2px}
  .badge.pink{color:var(--pink);border-color:var(--pink)}

  /* detail */
  .crumb{font-size:.9rem;color:var(--grey);margin-bottom:26px}
  .crumb a{border-bottom:1px solid var(--line-2)}
  .crumb span{margin:0 8px}
  .detail{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:clamp(30px,5vw,60px);align-items:start;max-width:940px;margin:0 auto}
  .detail-copy h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(2rem,5vw,3rem);line-height:1.06}
  .detail-copy .dsub{font-style:italic;color:var(--grey);font-size:1.15rem;margin-top:8px}
  .detail-copy .dmeta{font-size:.85rem;letter-spacing:.04em;color:var(--grey);text-transform:uppercase;margin-top:16px}
  .detail-copy .ddesc{margin-top:20px;font-size:1.1rem;color:var(--ink-2);line-height:1.75}
  .detail-copy .dactions{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  @media(max-width:640px){.detail{grid-template-columns:1fr;justify-items:center;text-align:center}.detail-cover{max-width:220px;width:100%}.detail-copy .dactions{justify-content:center}.detail-copy .dmeta{letter-spacing:.02em}}
  .empty{text-align:center;color:var(--grey);font-style:italic;padding:80px 20px}
  .empty a{border-bottom:1px solid var(--line-2)}

  /* footer */
  footer.site{background:var(--ink);color:#c9c7c0;padding:52px 0 28px;margin-top:24px}
  footer.site .fwrap{max-width:var(--maxw);margin:0 auto;padding-inline:22px}
  footer.site .ftop{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;padding-bottom:26px;border-bottom:1px solid rgba(255,255,255,.14)}
  footer.site .flogo{height:40px;filter:invert(1) brightness(1.7)}
  footer.site .flinks{display:flex;gap:22px;flex-wrap:wrap}
  footer.site .flinks a{font-size:.95rem;color:#c9c7c0;transition:color .2s}
  footer.site .flinks a:hover{color:#fff}
  footer.site .copy{text-align:center;padding-top:22px;font-size:.84rem;color:#8c8a83}
  @media(max-width:560px){footer.site .ftop{flex-direction:column;text-align:center;gap:18px}footer.site .flinks{justify-content:center}}

  /* login modal */
  .modal{position:fixed;inset:0;z-index:500;background:rgba(10,10,10,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:22px}
  .modal.show{display:flex}
  .modal-card{max-width:390px;width:100%;background:var(--paper);border-radius:4px;padding:32px 28px;box-shadow:var(--shadow)}
  .modal-card h3{font-family:"Fraunces",serif;font-weight:500;font-size:1.5rem}
  .modal-card p.mh{color:var(--grey);font-size:.95rem;margin:6px 0 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-bottom:7px}
  .field input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line-2);border-radius:3px;background:#fff;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(19,19,19,.08)}
  .modal .msg{font-size:.9rem;margin-top:10px;min-height:1.1em}
  .modal .msg.err{color:#b23a3a}
  .modal .row2{display:flex;gap:10px;margin-top:8px}
  .modal .row2 .btn{flex:1}

  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}#loader img{opacity:1}}
</style>
</head>
<body>
  <div id="loader"><div class="box"><img src="https://i.ibb.co/GQf0hjq1/Tyler-Nicholas-Books-removebg-preview.png" alt="Tyler Nicholas Books" /><div class="ln"></div></div></div>

  <header class="site">
    <div class="announce" id="announce"></div>
    <div class="wrap nav">
      <a class="brand" href="/" aria-label="Tyler Nicholas Books — home"><img src="https://i.ibb.co/GQf0hjq1/Tyler-Nicholas-Books-removebg-preview.png" alt="Tyler Nicholas Books" /></a>
      <button class="hamb" id="hamb" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/books/" class="active">Books</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap" id="bookDetail"><div class="empty">Opening the book…</div></div>
    </section>
  </main>

  <footer class="site">
    <div class="fwrap">
      <div class="ftop">
        <a href="/"><img class="flogo" src="https://i.ibb.co/GQf0hjq1/Tyler-Nicholas-Books-removebg-preview.png" alt="Tyler Nicholas Books" /></a>
        <div class="flinks"><a href="/">Home</a><a href="/books/">Books</a><a href="/about/">About</a><a href="/contact/">Contact</a></div>
      </div>
      <div class="copy">© <span id="year"></span> Tyler Nicholas Books. All rights reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL="https://lanrakgrrbyfhtzcxnof.supabase.co";
    const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnJha2dycmJ5Zmh0emN4bm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQwMTQsImV4cCI6MjEwMTI1MDAxNH0.gHaVFXo5vRjcOTlwHRaNNOP1WXqL_4h3ieWg6xnz3hY";
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
    const $=(s,r=document)=>r.querySelector(s);
    const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const money=b=>new Intl.NumberFormat(undefined,{style:'currency',currency:b.currency||'USD'}).format(b.price||0);
    const qs=k=>new URLSearchParams(location.search).get(k);
    $('#year').textContent=new Date().getFullYear();

    const lockSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    const isPriv=b=>b.type==='private';
    function coverEl(b){ const chip=isPriv(b)?`<span class="chip pink">${lockSVG} Private</span>`:''; if(b.cover_url)return `<div class="cover">${chip}<img src="${esc(b.cover_url)}" alt="${esc(b.title)} cover"/></div>`; return `<div class="cover ph${isPriv(b)?' priv':''}">${chip}<div class="ph-t">${esc(b.title)}</div></div>`; }

    const hamb=$('#hamb'),links=$('#navLinks');
    hamb.addEventListener('click',()=>{const o=links.classList.toggle('open');hamb.setAttribute('aria-expanded',o);});
    function hideLoader(){const l=$('#loader');if(l){l.classList.add('hide');setTimeout(()=>l.remove(),650);}}
    window.addEventListener('load',()=>setTimeout(hideLoader,400)); setTimeout(hideLoader,6000);


    function openPrivate(dest){
      sb.auth.getSession().then(({data:{session}})=>{ if(session){window.location.href=dest;} else showLogin(dest); }).catch(()=>showLogin(dest));
    }
    function showLogin(dest){
      let m=$('#loginModal');
      if(!m){
        m=document.createElement('div'); m.className='modal'; m.id='loginModal';
        m.innerHTML=`<div class="modal-card">
          <h3 class="disp">A private book</h3>
          <p class="mh">This one opens only for the person it was written for. Please sign in to continue.</p>
          <form id="loginForm">
            <div class="field"><label for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="username" required></div>
            <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
            <div class="row2"><button type="button" class="btn ghost" id="lgCancel">Not now</button><button type="submit" class="btn pink" id="lgGo">Sign in</button></div>
            <div class="msg" id="lgMsg"></div>
          </form></div>`;
        document.body.appendChild(m);
        $('#lgCancel',m).addEventListener('click',()=>m.classList.remove('show'));
        $('#loginForm',m).addEventListener('submit',async e=>{
          e.preventDefault();
          const btn=$('#lgGo',m), msg=$('#lgMsg',m);
          btn.disabled=true; btn.textContent='Signing in…'; msg.className='msg'; msg.textContent='';
          const {error}=await sb.auth.signInWithPassword({email:$('#lgEmail',m).value.trim(),password:$('#lgPass',m).value});
          if(error){ msg.className='msg err'; msg.textContent='We could not sign you in. Check your email and password.'; btn.disabled=false; btn.textContent='Sign in'; return; }
          window.location.href=dest;
        });
      }
      m.classList.add('show'); setTimeout(()=>$('#lgEmail',m).focus(),60);
    }

    (async function init(){
      let settings=null;
      try{ const s=await sb.from('tnb_settings').select('*').eq('id',1).maybeSingle(); settings=s.data; }catch(e){}
      if(settings&&settings.announcement_active&&settings.announcement_text){const a=$('#announce');a.textContent=settings.announcement_text;a.classList.add('show');}

      const slug=qs('slug'); let book=null;
      if(slug){
        try{ const {data}=await sb.from('tnb_books').select('*').eq('slug',slug).eq('status','published').maybeSingle(); book=data; }catch(e){}
      }
      const root=$('#bookDetail');
      if(!book){ root.innerHTML=`<div class="empty">That book could not be found. <a href="/books/">Back to the shelf</a>.</div>`; return; }
      document.title=`${book.title} — Tyler Nicholas Books`;

      const meta=[];
      if(book.tags&&book.tags.length) meta.push(book.tags.join(' · '));
      if(book.pages) meta.push(`${book.pages} pages`);
      if(book.published_date) meta.push(new Date(book.published_date).getFullYear());

      root.innerHTML=`
        <nav class="crumb reveal"><a href="/books/">Books</a> <span>/</span> ${esc(book.title)}</nav>
        <div class="detail reveal">
          <div class="detail-cover">${coverEl(book)}</div>
          <div class="detail-copy">
            <h1 class="disp">${esc(book.title)}</h1>
            ${book.subtitle?`<div class="dsub">${esc(book.subtitle)}</div>`:''}
            ${meta.length?`<div class="dmeta">${meta.map(esc).join(' &nbsp;·&nbsp; ')}</div>`:''}
            <div class="ddesc">${esc(book.description||book.blurb||'')}</div>
            <div class="dactions" id="dactions"></div>
          </div>
        </div>`;

      const actions=$('#dactions');
      if(isPriv(book)){
        actions.innerHTML=`<button class="btn pink" id="readPriv">Read book</button><span class="badge pink">Private · by invitation</span>`;
        $('#readPriv').addEventListener('click',()=>openPrivate(book.action_url||'/the-summer-i-found-home/'));
      } else if(book.type==='paid'){
        actions.innerHTML=`<a class="btn" href="${esc(book.action_url||'#')}">Buy — ${money(book)}</a>`;
      } else {
        actions.innerHTML=`<a class="btn" href="${esc(book.action_url||'#')}">Read</a>`;
      }

      const io=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.12});
      document.querySelectorAll('.reveal').forEach(r=>io.observe(r));
    })();
  </script>
</body>
</html>
